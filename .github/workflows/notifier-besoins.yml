name: Notifier les besoins internes

on:
  schedule:
    # Toutes les 2 heures de 07:07 à 17:07 UTC, du lundi au vendredi
    # (soit 9h–19h à Paris en été, 8h–18h en hiver), en évitant l'heure pile.
    # GitHub abandonne une bonne part des exécutions planifiées quand il est chargé :
    # depuis le 27/08, ~2 passages par jour seulement, que le cron soit à 2 h, 1 h
    # ou 15 min (aucun passage le 2026-10-07 au pas de 15 min). Le pas importe donc
    # peu ; retour à 2 h en attendant de décider d'un déclenchement externe.
    - cron: "7 7-17/2 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ne rien poster, seulement afficher ce qui serait envoyé"
        type: boolean
        default: true

# Deux exécutions simultanées pourraient annoncer deux fois le même besoin :
# on sérialise, sans annuler celle qui tourne déjà.
concurrency:
  group: notifier-besoins
  cancel-in-progress: false

jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Aucune dépendance à installer : le script n'utilise que la stdlib.
      - name: Annonces, relances et rappels de pré-validation
        run: python notify.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_CANDIDATURES_DB_ID: ${{ secrets.NOTION_CANDIDATURES_DB_ID }}
          NOTION_DESTAFF_DB_ID: ${{ secrets.NOTION_DESTAFF_DB_ID }}
          NOTION_SUIVI_BESOINS_DB_ID: ${{ secrets.NOTION_SUIVI_BESOINS_DB_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_PREVALIDATION_URL: ${{ secrets.DISCORD_WEBHOOK_PREVALIDATION_URL }}
          DISCORD_WEBHOOK_ANNONCES_URL: ${{ secrets.DISCORD_WEBHOOK_ANNONCES_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
