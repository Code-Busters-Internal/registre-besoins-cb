name: Notifier les besoins internes

on:
  schedule:
    # Toutes les 15 minutes de 06:07 à 17:52 UTC, du lundi au vendredi
    # (soit 8h–19h à Paris en été, 7h–18h en hiver).
    # GitHub abandonne une bonne part des exécutions planifiées quand il est chargé :
    # avec un cron horaire à :23, seules ~2 tournaient par jour, à des heures
    # irrégulières (constaté le 2026-10-07 : 15h25 et 21h36 la veille, rien à 8h23).
    # D'où le pas de 15 min, en évitant l'heure pile — sans risque, le job est idempotent.
    - cron: "7,22,37,52 6-17 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ne rien poster, seulement afficher ce qui serait envoyé"
        type: boolean
        default: true

# Deux exécutions simultanées pourraient annoncer deux fois le même besoin :
# on sérialise, sans annuler celle qui tourne déjà.
concurrency:
  group: notifier-besoins
  cancel-in-progress: false

jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Aucune dépendance à installer : le script n'utilise que la stdlib.
      - name: Annonces, relances et rappels de pré-validation
        run: python notify.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_CANDIDATURES_DB_ID: ${{ secrets.NOTION_CANDIDATURES_DB_ID }}
          NOTION_DESTAFF_DB_ID: ${{ secrets.NOTION_DESTAFF_DB_ID }}
          NOTION_SUIVI_BESOINS_DB_ID: ${{ secrets.NOTION_SUIVI_BESOINS_DB_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_PREVALIDATION_URL: ${{ secrets.DISCORD_WEBHOOK_PREVALIDATION_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
